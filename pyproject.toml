[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dose2qaly"
version = "1.0.0"
description = "Monte Carlo lifetime cancer-risk simulation for diagnostic medical-imaging exams"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "python-calamine",
]

[project.optional-dependencies]
# Pick the CuPy wheel matching your CUDA toolkit, e.g. cupy-cuda12x.
gpu = ["cupy"]
perf = ["psutil", "threadpoolctl", "zstandard"]
dev = ["openpyxl", "ruff"]

[project.urls]
Repository = "https://github.com/thyvarinen/dose2qaly"

[project.scripts]
dose2qaly = "dose2qaly.__main__:main"

[tool.setuptools.packages.find]
include = ["dose2qaly*"]
exclude = ["tests*", "tools*"]

